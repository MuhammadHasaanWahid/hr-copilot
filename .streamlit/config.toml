[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f3f6"
textColor = "#0b0b0b"

[server]
maxUploadSize = 1
enableXsrfProtection = true

[runner]
# No "magic": bare expressions are never auto-rendered (prevents stray internal output in the UI).
magicEnabled = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
